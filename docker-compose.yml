version: "3.9"

services:
  backend:
    build: ./backend
    container_name: smart-campus-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8080}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      # Persist backend logs on the host so they survive container restarts
      - ./backend/logs:/app/logs
    restart: unless-stopped
    networks:
      - campus-net

  frontend:
    build: ./frontend
    container_name: smart-campus-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        # Wait for the backend's HEALTHCHECK to report healthy,
        # not just for the container process to start
        condition: service_healthy
    restart: unless-stopped
    networks:
      - campus-net

networks:
  campus-net:
    driver: bridge
