version: "3.9"

services:
  backend:
    build: ./backend
    container_name: smart-campus-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    networks:
      - campus-net

  frontend:
    build: ./frontend
    container_name: smart-campus-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - campus-net

networks:
  campus-net:
    driver: bridge
